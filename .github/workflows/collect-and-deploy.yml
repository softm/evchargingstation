name: Collect and deploy EV charging stations

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collection_mode:
        description: 'Collection mode (auto, full, skip)'
        type: choice
        options: [auto, full, status, skip]
        default: auto
  schedule:
    # Best-effort 5-minute status updates. GitHub may delay or drop runs.
    # ENABLE_SCHEDULED_COLLECTION no longer needs to be set. Emergency pause:
    # set repository variable PAUSE_EV_COLLECTION=true.
    - cron: '3-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evchargingstation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || vars.PAUSE_EV_COLLECTION != 'true'
    outputs:
      publish: ${{ steps.publish_decision.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Restore last complete dataset and request budget
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .cache/evchargingstation
            public/data
          key: evchargingstation-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: evchargingstation-data-v1-
      - name: Select collection mode
        id: selected_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.collection_mode || 'auto' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mode="$INPUT_MODE"
          if [ "$EVENT_NAME" = 'push' ] && [[ "$COMMIT_MESSAGE" == *"[collect:full]"* ]]; then
            # A single commit can deliberately force a full national rescan.
            mode=full
          # Code-only pushes normally reuse the last verified inventory.
          elif [ "$EVENT_NAME" = 'push' ] && python3 -c 'import json,pathlib,sys; p=pathlib.Path("public/data/manifest.json"); m=json.loads(p.read_text()); base=p.parent; sys.exit(0 if m.get("generatedAt") and m.get("totalStations",0)>0 and m.get("regions") and all((base/r["path"]).is_file() for r in m["regions"]) else 1)'; then
            mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Check collection configuration
        id: configuration
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          REQUESTED_MODE: ${{ steps.selected_mode.outputs.mode }}
        run: |
          if [ -n "$DATA_GO_KR_SERVICE_KEY" ] && [ "$REQUESTED_MODE" != 'skip' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Collection skipped. Existing data and its original confirmation times are preserved.'
          fi
      - name: Collect official data
        id: collect
        if: steps.configuration.outputs.enabled == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          REQUESTED_MODE: ${{ steps.selected_mode.outputs.mode }}
          MAX_API_CALLS_PER_RUN: ${{ vars.MAX_API_CALLS_PER_RUN || '100' }}
          MAX_API_CALLS_PER_DAY: ${{ vars.MAX_API_CALLS_PER_DAY || '1000' }}
        run: python3 scripts/collect.py --mode "$REQUESTED_MODE" --output public/data --state-dir .cache/evchargingstation
      - name: Collect permitted public tariff catalog
        id: fees
        continue-on-error: true
        env:
          CHARGEINFO_REUSE_APPROVED: ${{ vars.CHARGEINFO_REUSE_APPROVED || 'false' }}
        run: |
          python3 scripts/collect_fees.py | tee /tmp/ev-fees-result.json
          if grep -q '"status": "updated"' /tmp/ev-fees-result.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve request budget and last complete dataset
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .cache/evchargingstation
            public/data
          key: evchargingstation-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Data collection status
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::warning::Collection failed; last complete snapshot is retained. Its age is visible in the app.'
          echo '### Data collection needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'The site will show the last complete snapshot and its original confirmation time. Check service authorization and quota.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful requested full collection
        if: (github.event_name == 'workflow_dispatch' && inputs.collection_mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[collect:full]'))
        env:
          COLLECTION_ENABLED: ${{ steps.configuration.outputs.enabled }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          if [ "$COLLECTION_ENABLED" != 'true' ] || [ "$COLLECTION_OUTCOME" != 'success' ]; then
            echo '::error::The explicitly requested full collection did not succeed. A new deployment is blocked; the existing published site is retained.'
            echo '### Requested full collection failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Full collection requires configured credentials and a successful collection step. Review collection authorization and errors before retrying. No new deployment was published.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Determine deployment necessity
        id: publish_decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          FEE_UPDATED: ${{ steps.fees.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$COLLECTION_OUTCOME" = 'success' ] || [ "$FEE_UPDATED" = 'true' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'No new verified information; existing deployment preserved.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check app contracts
        if: steps.publish_decision.outputs.publish == 'true'
        run: npm run check
      - name: Test domain and collector
        if: github.event_name != 'schedule' && steps.publish_decision.outputs.publish == 'true'
        run: npm test
      - name: Build public application
        if: steps.publish_decision.outputs.publish == 'true'
        env:
          PUBLIC_NAVER_MAP_CLIENT_ID: ${{ vars.PUBLIC_NAVER_MAP_CLIENT_ID }}
          PUBLIC_EV_API_BASE_URL: ${{ vars.PUBLIC_EV_API_BASE_URL }}
          PUBLIC_EV_DATA_BASE_URL: ${{ vars.PUBLIC_EV_DATA_BASE_URL }}
          SCHEDULED_COLLECTION_ENABLED: ${{ vars.PAUSE_EV_COLLECTION != 'true' }}
        run: npm run build
      - uses: actions/configure-pages@v6.0.0
        if: steps.publish_decision.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.publish_decision.outputs.publish == 'true'
        with:
          path: dist
          name: evchargingstation-pages-${{ github.run_attempt }}
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: evchargingstation-pages-${{ github.run_attempt }}
      - name: Verify published application
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: npm run verify:deployment
