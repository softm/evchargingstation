name: Verify EV map changes

on:
  push:
    branches:
      - 'fix-map-*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check public app and syntax
        run: npm run check
      - name: Test geolocation, markers, data contract, and collector
        run: npm test
      - name: Build without exposing credentials
        run: npm run build
